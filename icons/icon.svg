<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e295d" />
      <stop offset="60%" stop-color="#0c122c" />
      <stop offset="100%" stop-color="#060918" />
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="neonTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#neonTeal)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="16 12" />

  <!-- Barbell Graphic -->
  <g transform="translate(256,256) rotate(-35) translate(-256,-256)">
    <!-- Main Bar -->
    <rect x="100" y="244" width="312" height="24" rx="12" fill="#cbd5e1" filter="url(#glow)" />
    <rect x="140" y="244" width="232" height="24" rx="4" fill="url(#neonTeal)" opacity="0.8" />

    <!-- Left Plates -->
    <rect x="136" y="160" width="22" height="192" rx="10" fill="url(#primaryGrad)" filter="url(#glow)" />
    <rect x="110" y="184" width="20" height="144" rx="8" fill="url(#metalPlate)" stroke="#f97316" stroke-width="3" />
    <rect x="88" y="210" width="16" height="92" rx="6" fill="#334155" />

    <!-- Right Plates -->
    <rect x="354" y="160" width="22" height="192" rx="10" fill="url(#primaryGrad)" filter="url(#glow)" />
    <rect x="382" y="184" width="20" height="144" rx="8" fill="url(#metalPlate)" stroke="#f97316" stroke-width="3" />
    <rect x="408" y="210" width="16" height="92" rx="6" fill="#334155" />
    
    <!-- Grip knurling -->
    <line x1="220" y1="246" x2="220" y2="266" stroke="#0f172a" stroke-width="3" opacity="0.6" />
    <line x1="238" y1="246" x2="238" y2="266" stroke="#0f172a" stroke-width="3" opacity="0.6" />
    <line x1="256" y1="246" x2="256" y2="266" stroke="#0f172a" stroke-width="3" opacity="0.6" />
    <line x1="274" y1="246" x2="274" y2="266" stroke="#0f172a" stroke-width="3" opacity="0.6" />
    <line x1="292" y1="246" x2="292" y2="266" stroke="#0f172a" stroke-width="3" opacity="0.6" />
  </g>

  <!-- Energy Pulse / Lightning Bolt in Center -->
  <path d="M 270 170 L 225 250 L 260 252 L 235 340 L 305 240 L 265 238 Z" fill="url(#primaryGrad)" filter="url(#glow)" />
</svg>
